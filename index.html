<meta charset="UTF-8">

<title>Autumn — ម៉ឺនុយអាហារ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --card-bg:#ffffff;
    --ink:#1d1d1f;
    --ink-soft:#6e6e73;
    --hairline:#e8e8ed;
    --pill-bg:#f5f5f7;
    --img-bg:#f0f0f0;
    --accent:#8a5a34;
    --accent-tint:#f4ece3;
    --radius-card:22px;
    --shadow-card:0 1px 2px rgba(0,0,0,0.04), 0 10px 30px rgba(0,0,0,0.06);
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:auto; } /* instant jump — no animated scrolling */

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter','Noto Sans Khmer',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .khmer{ font-family:'Noto Sans Khmer','Inter',-apple-system,sans-serif; }

  /* ---------- Header ---------- */
  header{
    padding:96px 24px 40px;
    text-align:center;
  }

  header .wordmark{
    margin:0;
    font-family:'Fraunces','Noto Sans Khmer',serif;
    font-weight:600;
    font-size:56px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }

  header .sub{
    margin:14px auto 0;
    max-width:480px;
    font-size:17px;
    color:var(--ink-soft);
    line-height:1.6;
  }

  /* ---------- Category nav ---------- */
  nav.cat-nav{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(255,255,255,0.92);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--hairline);
    padding:14px 24px;
  }

  .cat-nav-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }

  .cat-pill{
    display:inline-block;
    padding:9px 18px;
    border-radius:100px;
    background:var(--pill-bg);
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    text-decoration:none;
    white-space:nowrap;
  }

  .cat-pill:hover{
    background:var(--accent-tint);
    color:var(--accent);
  }

  /* ---------- Sections ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:8px 24px 40px;
  }

  section.category{
    padding:64px 0 16px;
    scroll-margin-top:76px;
  }

  section.category + section.category{
    border-top:1px solid var(--hairline);
  }

  .cat-heading{
    margin:0 0 40px;
    text-align:center;
  }

  .cat-heading .eyebrow{
    display:block;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }

  .cat-heading h2{
    margin:0;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:26px;
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card-bg);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .card-image{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:var(--img-bg);
    overflow:hidden;
  }

  .card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .card-image .placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#c7c7cc;
  }

  .card-image .placeholder svg{ width:38px; height:38px; }

  .card-body{
    padding:18px 20px 20px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:14px;
  }

  .card-name{
    margin:0;
    font-size:16px;
    font-weight:600;
    line-height:1.5;
    color:var(--ink);
  }

  .new-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--accent);
    background:var(--accent-tint);
    padding:2px 7px;
    border-radius:6px;
    margin-right:7px;
    vertical-align:middle;
  }

  .card-price{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    background:var(--pill-bg);
    padding:6px 12px;
    border-radius:100px;
    white-space:nowrap;
  }

  footer{
    text-align:center;
    padding:40px 24px 90px;
    color:var(--ink-soft);
    font-size:13px;
    border-top:1px solid var(--hairline);
    margin-top:20px;
  }

  @media (max-width:600px){
      header{ padding:64px 20px 32px; }
      header .wordmark{ font-size:40px; }
      section.category{ padding:44px 0 8px; }
      .cat-heading h2{ font-size:22px; }
      .grid{ grid-template-columns:repeat(auto-fill, minmax(145px,1fr)); gap:14px; }
      .card-body{
        padding:12px 14px 16px;
        flex-direction:column;
        align-items:center;      /* was flex-start */
        text-align:center;       /* centers the name text */
        gap:8px;
      }
      .card-name{ font-size:14px; }
  }
</style>
</head>

    `;
